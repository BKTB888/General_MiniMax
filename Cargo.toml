[workspace]
resolver = "3"
members = [
    "general_minimax",
    "games/connect_k",
    "games/mancala",
    "games/five_in_row",
    "app", "games/gomoku",
    "games/hive",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
general_minimax = { path = "general_minimax" }
connect_k = { path = "games/connect_k" }
mancala = { path = "games/mancala" }
five_in_row = { path = "games/five_in_row" }
hive = { path = "games/hive" }

arrayvec = "0.7"
colored = "3"
rand = "0.10"
crossterm = "0.29"
rayon = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
smallvec = "1"

# Lets small helpers inline across crates and codegen units: Hive's perft is 11% faster with
# both, and neither alone gets most of that.
[profile.release]
lto = "fat"
codegen-units = 1

# Release speed with debug symbols, so profilers like samply show function names.
[profile.profiling]
inherits = "release"
debug = true

# Same for bench binaries, so `games/profile-bench.sh` can profile them.
[profile.bench]
debug = true
